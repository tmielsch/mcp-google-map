# Docker Compose for tmielsch/mcp-google-map (fix/transit-details branch)
# 
# Deployment:
#   1. Clone the fork: git clone -b fix/transit-details https://github.com/tmielsch/mcp-google-map.git
#   2. cd into it, put this file and .env there
#   3. docker compose up -d --build
#
# To update after code changes:
#   git pull && docker compose up -d --build

services:
  mcp-google-map:
    build:
      context: .
      dockerfile: Dockerfile.fork
    container_name: mcp-google-map
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    network_mode: service:tailscale
    restart: unless-stopped
    depends_on:
      - tailscale

  tailscale:
    image: tailscale/tailscale:latest
    container_name: mcp-googlemap-tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_HOSTNAME=mcp-google-map
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./tailscale-config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped